<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Oja — shop Danzora by chat</title>
  <meta name="description" content="Tell Oja what you need. It finds the right gadget and lets you pay with PayPal, right in the chat." />
  <meta name="theme-color" content="#1f2a5c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/chat.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="32" height="32"><circle cx="16" cy="16" r="15" fill="#e0a526"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#1f2a5c" stroke-width="3"/><circle cx="16" cy="16" r="2.6" fill="#1f2a5c"/></svg>
        </span>
        <div>
          <h1 class="wordmark">Oja</h1>
          <p class="store" id="store-line">Shopping assistant for Danzora</p>
        </div>
      </div>
      <div class="top-actions">
      <label class="currency">
        <span class="sr-only">Pay in</span>
        <select id="currency" aria-label="Currency PayPal charges in">
          <option value="USD">$ USD</option>
          <option value="GBP">£ GBP</option>
          <option value="EUR">€ EUR</option>
          <option value="CAD">CA$ CAD</option>
        </select>
      </label>
      <button class="cart-chip" id="cart-chip" type="button" aria-live="polite" aria-label="Cart">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.5" fill="currentColor"/><circle cx="17" cy="20" r="1.5" fill="currentColor"/></svg>
        <span id="cart-count">0</span>
        <span class="price" id="cart-total">₦0</span>
      </button>
      </div>
    </header>
    <div class="adire" aria-hidden="true"></div>

    <main class="thread" id="thread" aria-live="polite" aria-label="Conversation">
      <section class="intro" id="intro">
        <h2>Shop Danzora by chat — for yourself, or for family back home.</h2>
        <p>Tell Oja what you need in your own words. Living abroad? Pay with PayPal in pounds, dollars or euros, and we deliver to your family anywhere in Nigeria.</p>
      </section>
    </main>

    <footer class="composer-wrap">
      <div class="chips" id="chips">
        <button type="button" class="chip gift">I'm in London — a phone for my mum in Lokoja, about £120</button>
        <button type="button" class="chip">A phone under 200k for content</button>
        <button type="button" class="chip">Something for power cuts</button>
        <button type="button" class="chip">Laptop for coding</button>
        <button type="button" class="chip">Earbuds with noise cancelling</button>
      </div>
      <form class="composer" id="composer" autocomplete="off">
        <label for="input" class="sr-only">Message Oja</label>
        <input id="input" name="message" maxlength="1000" placeholder="Tell Oja what you need…" enterkeyhint="send" />
        <button class="send" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <p class="fineprint" id="mode-line"></p>
    </footer>
  </div>

  <template id="tpl-typing">
    <div class="msg bot typing" aria-label="Oja is typing"><span></span><span></span><span></span></div>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
